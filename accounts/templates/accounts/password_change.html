{% extends 'accounts/base.html' %}
{% block title %}Change password - Sajhya Health{% endblock %}
{% block content %}
<div class="text-center mb-4"><h1 class="fw-bold page-title">Change password</h1></div>
<form method="post" class="form-panel">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-gradient">Change password</button>
    <p class="text-center mt-3 mb-0"><a href="{% url 'accounts:welcome' %}" class="page-lead">&larr; Back</a></p>
</form>
{% endblock %}
