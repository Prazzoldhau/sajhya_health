<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}Support{% endblock %} | Sajhya Health</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5faf7; color: #18352b; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 18px 50px; }
  h1 { margin: 0 0 4px; font-size: 22px; } .sub { color: #6c8178; font-size: 12.5px; margin-bottom: 14px; }
  .note { background: #fff8e6; border: 1px solid #f0d9a0; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #8a5a00; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e1ebe5; border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 10.5px; letter-spacing: .05em; color: #6c8178; background: #f1f8f4; padding: 8px 10px; } td { padding: 8px 10px; border-top: 1px solid #edf3ef; }
  a { color: #116b43; font-weight: 700; }
</style></head><body><div class="wrap">{% block body %}{% endblock %}</div></body></html>
